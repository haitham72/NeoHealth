<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReguLense</title>
    <meta
      name="description"
      content="Ask a question about UAE health regulation and get the answer with the document, the version in force, and the page it came from. Built for clinicians, compliance officers and hospital administrators."
    />

    <!-- Link previews. og:image and og:url must be absolute -- a scraper has no page
         context to resolve a relative path against, and a same-origin deployment
         doesn't change that. Both point at the Render service, which serves the API
         and this built frontend from one origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReguLense" />
    <meta property="og:title" content="ReguLense -- UAE health regulation, answered from the source" />
    <meta
      property="og:description"
      content="Version-aware answers on DHA, DoH Abu Dhabi and MOHAP regulation. Every answer cites the document, the version in force, and the page -- or abstains."
    />
    <meta property="og:url" content="https://neohealth-gpzo.onrender.com/" />
    <meta property="og:image" content="https://neohealth-gpzo.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ReguLense: UAE health regulation, answered from the source document." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReguLense -- UAE health regulation, answered from the source" />
    <meta
      name="twitter:description"
      content="Version-aware answers on DHA, DoH Abu Dhabi and MOHAP regulation. Every answer cites the document, the version in force, and the page -- or abstains."
    />
    <meta name="twitter:image" content="https://neohealth-gpzo.onrender.com/og-image.png" />
  </head>
