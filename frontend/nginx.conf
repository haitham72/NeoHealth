server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback -- no backend proxy here. The browser calls the backend's own
    # origin directly via the VITE_API_URL baked into the build; CORS on the
    # backend handles the cross-origin request.
    location / {
        try_files $uri /index.html;
    }
}
