services:
  - type: web
    name: reglens
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: reglens
      - key: LANGSMITH_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://neohealth-gpzo.onrender.com,https://frontend-tawny-kappa-10.vercel.app,https://frontend-blue-zeta-82.vercel.app,http://localhost:5173
      - key: DAILY_OPENAI_CALL_CAP
        value: "300"
      - key: OPENAI_API_KEY
        sync: false
      - key: NARAROUTER_API_KEY
        sync: false
